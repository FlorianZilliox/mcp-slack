name: Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: npm install -g @anthropic-ai/dxt

      - name: Build binaries
        run: make build-all-platforms

      - name: Build DTX Extension
        run: make build-dxt

      - name: Upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            LICENSE
            build/mcp-slack-*
            build/mcp-slack.dxt
            .env.dist
            docker-compose.yml

      # Publication npm optionnelle : seulement si un NPM_TOKEN est configure.
      # Sans compte npm, le tag produit quand meme la release GitHub avec les
      # binaires (l'install par binaire ne depend pas de npm).
      - name: Publish npm
        if: ${{ env.NPM_TOKEN != '' }}
        run:
          make npm-publish
